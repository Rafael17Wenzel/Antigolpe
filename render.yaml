# Blueprint do Render — ambiente DEMONSTRATIVO do protótipo acadêmico Antigolpe.
# Sintaxe conferida na referência oficial (https://render.com/docs/blueprint-spec) em 2026-11-17.
#
# NÃO aplicar sem aprovação explícita: criar o Blueprint no painel cria recursos que podem
# ser cobrados. Os planos abaixo são os de menor custo; confira preço e limites no painel
# no momento da criação (veja docs/DEPLOY.md). Nenhum segredo está neste arquivo.

services:
  # API Spring Boot (Docker)
  - type: web
    runtime: docker
    name: antigolpe-api
    # Caminhos relativos à raiz do repositório (sem rootDir, para não haver ambiguidade)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free                      # sem custo, com limitações (hiberna sem uso); troque por um pago se precisar
    branch: main
    autoDeployTrigger: checksPass   # só publica depois do CI (.github/workflows/ci.yml) passar
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Conexão do banco: o app converte DATABASE_URL (postgresql://...) em JDBC sozinho
      - key: DATABASE_URL
        fromDatabase:
          name: antigolpe-db
          property: connectionString
      # Chave de assinatura do JWT da área do RH: gerada pelo Render. Trocar a chave só derruba as sessões abertas.
      - key: JWT_SECRET
        generateValue: true
      # URL do site estático, informada no painel na criação (ex.: https://antigolpe-web.onrender.com)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Endereço real do cliente atrás do proxy do Render (limite de requisições)
      - key: FORWARD_HEADERS_STRATEGY
        value: native
      # Dados FICTÍCIOS rotulados ("Cadastro fictício do protótipo acadêmico (não é vaga real)").
      # Ligados porque este é um ambiente de demonstração; desligue (false) em qualquer uso real.
      - key: DEMO_SEED
        value: "true"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC"

  # Frontend React (site estático)
  - type: web
    runtime: static
    name: antigolpe-web
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    buildFilter:
      paths:
        - frontend/**
    envVars:
      # URL pública da API, lida no build (ex.: https://antigolpe-api.onrender.com)
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' https://*.onrender.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(), camera=(), microphone=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"

databases:
  - name: antigolpe-db
    databaseName: antigolpe
    user: antigolpe
    postgresMajorVersion: "16"      # mesma versão usada nos testes de integração
    plan: free                      # sem custo, com limitações (1 GB; pode expirar); veja docs/DEPLOY.md
    ipAllowList: []                 # só a rede privada do Render (a API) acessa o banco
