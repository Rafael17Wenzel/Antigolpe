# Pipeline de verificação (Sprint 08). Não faz deploy.
# Backend: testes com H2 e também contra PostgreSQL 16 real (serviço do runner).
# Frontend: lint, contraste, build e E2E (Playwright + axe) contra o backend real no perfil h2.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: antigolpe
          POSTGRES_PASSWORD: antigolpe_ci
          POSTGRES_DB: antigolpe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U antigolpe" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes (H2 + PostgreSQL)
        working-directory: backend
        env:
          TEST_PG_URL: jdbc:postgresql://localhost:5432/antigolpe_test
          TEST_PG_USER: antigolpe
          TEST_PG_PASSWORD: antigolpe_ci
        run: sh mvnw -B test
      - name: Empacotar
        working-directory: backend
        run: sh mvnw -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/antigolpe-0.0.1-SNAPSHOT.jar
          retention-days: 3

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Lint, contraste e build
        working-directory: frontend
        run: |
          npx eslint src e2e scripts
          npm run contraste
          npm run build
      - name: Auditoria de dependências de produção
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: E2E (Playwright + axe)
        working-directory: frontend
        env:
          E2E_BACKEND_CMD: SPRING_PROFILES_ACTIVE=h2 java -jar ../backend/target/antigolpe-0.0.1-SNAPSHOT.jar
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
