# Configuração usada pelos testes (perfil padrão no classpath de teste).
# Cada contexto Spring de teste ganha um banco H2 próprio.
spring.datasource.url=jdbc:h2:mem:t${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Chave fixa apenas para testes (não é segredo de nenhum ambiente)
app.token.hmac-secret=chave-de-teste-somente-para-testes-automatizados
app.demo.seed=true

# Limites altos nos testes gerais; LimiteRequisicoesTest usa limites baixos próprios
app.limite.validacao.por-minuto=100000
app.limite.denuncia.por-hora=100000
app.limite.sugestao.por-minuto=100000
