# Perfil de demonstração sem instalar banco: H2 em memória (modo PostgreSQL).
# Uso: SPRING_PROFILES_ACTIVE=h2. Os dados somem ao encerrar a aplicação.
spring.datasource.url=jdbc:h2:mem:antigolpe;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

app.token.permitir-chave-efemera=true
app.demo.seed=true
