spring.application.name=antigolpe

# Porta: o Render injeta $PORT; localmente usa 8080
server.port=${PORT:8080}

# Origens liberadas no CORS (lista separada por vírgula).
# Em produção, defina CORS_ALLOWED_ORIGINS no Render.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://antigolpe-1.onrender.com}

# Banco (PostgreSQL). Sem perfil, tudo vem de variáveis de ambiente.
# DB_URL é obrigatória: sem ela a aplicação NÃO sobe (evita cair num banco em memória).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

# O esquema é controlado só pelo Flyway; o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Área administrativa (RH). Usuário fixo root/root por decisão do projeto (D057).
# JWT HS256 com validade de 8 horas. Sem JWT_SECRET (mín. 32 caracteres), uma chave aleatória
# é gerada a cada início e as sessões abertas caem ao reiniciar.
app.admin.jwt-secret=${JWT_SECRET:}
app.admin.sessao-horas=8
app.limite.login.por-minuto=${LIMITE_LOGIN_POR_MINUTO:5}

# Dados fictícios de demonstração: desligados por padrão
app.demo.seed=${DEMO_SEED:false}

# Retenção (dias) de validações e denúncias; limpeza diária às 03:30
app.retencao.validacao-dias=${RETENCAO_VALIDACAO_DIAS:90}
app.retencao.denuncia-dias=${RETENCAO_DENUNCIA_DIAS:180}
app.retencao.cron=0 30 3 * * *

# Actuator: expõe somente o health check, sem detalhes internos
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Erros padrão do Spring nunca devolvem stack trace nem mensagens internas
server.error.include-stacktrace=never
server.error.include-message=never

# Limite de requisições por cliente (em memória, por instância). 429 + Retry-After ao exceder.
app.limite.validacao.por-minuto=${LIMITE_VALIDACAO_POR_MINUTO:20}
app.limite.denuncia.por-hora=${LIMITE_DENUNCIA_POR_HORA:10}
app.limite.sugestao.por-minuto=${LIMITE_SUGESTAO_POR_MINUTO:30}

# Endereço real do cliente atrás do proxy do Render. "native" só confia em proxies de rede
# interna (RemoteIpValve); padrão "none" (desenvolvimento local, sem proxy).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Tamanho máximo de cabeçalhos e corpos aceitos (as entradas válidas são bem menores)
server.max-http-request-header-size=16KB
server.tomcat.max-swallow-size=64KB

# Leitura de prints por IA no simulador de chat (Google Gemini, D061). A chave fica SÓ no backend.
# Sem GEMINI_API_KEY, a rota responde 503 e o site usa a leitura local (OCR no navegador).
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.modelo=${GEMINI_MODELO:gemini-3.5-flash-lite}
app.gemini.url=https://generativelanguage.googleapis.com
app.gemini.timeout-segundos=20
app.limite.gemini.por-minuto=${LIMITE_GEMINI_POR_MINUTO:5}

# Upload do print (5 MB); a imagem fica só em memória
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.file-size-threshold=6MB
