# Perfil de desenvolvimento com PostgreSQL local.
# Uso: SPRING_PROFILES_ACTIVE=dev e DB_PASSWORD definido no ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/antigolpe}
spring.datasource.username=${DB_USER:antigolpe}
spring.datasource.password=${DB_PASSWORD:}

# Sem TOKEN_HMAC_SECRET, usa chave efêmera (tokens de demonstração são regenerados)
app.token.permitir-chave-efemera=true
app.demo.seed=true
